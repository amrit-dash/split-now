name: Wipe data

# One-off reset of production before launch (scripts/wipe-data.mjs): deletes every account and all
# user data except the admins. Dry run unless `confirm` is exactly "delete everything but the admins".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "delete everything but the admins" to delete; anything else is a dry run'
        type: string
        default: dry run

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  wipe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - name: Service-account credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Wipe
        env:
          WIPE: ${{ inputs.confirm == 'delete everything but the admins' && '1' || '0' }}
        run: node scripts/wipe-data.mjs
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
