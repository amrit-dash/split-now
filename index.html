<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Split Now</title>
    <meta name="description" content="Spending is wise, splitting is free. Split Now! Split bills with friends, scan receipts and settle up over UPI in a tap." />
    <meta property="og:title" content="Split Now" />
    <meta property="og:description" content="Spending is wise, splitting is free. Split Now!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://split-now.web.app" />
    <!-- Link previews (WhatsApp, Slack, X, iMessage): the 1200x630 banner from docs/assets/hero.png. A JPEG on purpose,
         so the service worker (which precaches *.png) doesn't download it into every install. -->
    <meta property="og:image" content="https://split-now.web.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Split Now: Spending is wise, splitting is free. Split Now! Free and open source bill splitting." />
    <meta property="og:site_name" content="Split Now" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://split-now.web.app/og-image.jpg" />
    <meta name="theme-color" content="#6d28d9" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Split Now" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /*
       * Launch splash, painted from the HTML alone before any script loads, and kept by <Splash/>
       * in src/App.tsx (same classes) while sign-in is read; src/lib/splash.ts has the timing.
       * The logo pops in, the stack slides up, then the tagline arrives line by line. The page
       * is dark (the manifest's background_color, which Android's own launch screen uses) with a
       * faint glow of the accent, so the hand-over from the system splash is seamless. Every
       * delay is offset by --t, the ms already elapsed, so React's copy continues the animation
       * instead of restarting it. The accent variables come from index.css once it lands.
       */
      .boot { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 0 1.25rem; background: #0b0a14; background: radial-gradient(70% 50% at 50% 45%, rgb(124 58 237 / 0.2), transparent 70%), #0b0a14; background: radial-gradient(70% 50% at 50% 45%, color-mix(in oklab, var(--color-brand-600, #7c3aed) 22%, transparent), transparent 70%), #0b0a14; color: #fff; font-family: 'Inter Variable', Inter, ui-sans-serif, system-ui, sans-serif; text-align: center; }
      .boot-stack { display: flex; flex-direction: column; align-items: center; animation: boot-up 0.5s cubic-bezier(0.3, 0, 0.2, 1) calc(650ms - var(--t, 0ms)) both; }
      .boot-logo { width: 5.5rem; height: 5.5rem; filter: drop-shadow(0 18px 32px rgb(0 0 0 / 0.5)); animation: boot-pop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.35) calc(0ms - var(--t, 0ms)) both; }
      .boot-tag { margin: 1rem 0 0; }
      .boot-l1, .boot-l2 { display: block; animation: boot-line 0.45s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      .boot-l1 { font-size: 0.95rem; line-height: 1.5rem; font-weight: 500; color: rgb(226 232 240 / 0.85); text-wrap: balance; animation-delay: calc(1000ms - var(--t, 0ms)); }
      .boot-l2 { font-size: 1.5rem; line-height: 2.25rem; font-weight: 800; letter-spacing: -0.02em; color: #e9d5ff; background: linear-gradient(90deg, var(--color-brand-300, #c4b5fd), var(--color-duo-300, #f9a8d4)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation-delay: calc(1300ms - var(--t, 0ms)); }
      /* the stack starts lowered by half the tagline's height, so the logo alone sits in the middle */
      @keyframes boot-up { from { transform: translateY(2.375rem); } }
      @keyframes boot-pop { from { transform: scale(0.6); opacity: 0; } }
      @keyframes boot-line { from { transform: translateY(0.6rem); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .boot-stack, .boot-logo, .boot-l1, .boot-l2 { animation: none; } }
    </style>
    <script>
      // The splash's clock (src/lib/splash.ts): React's copy of the splash picks up from here.
      window.__bootT0 = performance.now()
      // Apply theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('splitit-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
      // Accent colour, dual tone and text on accent (src/lib/accent.ts). Keep this map in sync with ACCENTS there.
      try {
        var accents = { violet: '#6d28d9', ocean: '#1447e6', neon: '#426400', berry: '#97176e', lime: '#426400', gold: '#774f00', graphite: '#314158' }
        var retired = { saffron: 'gold', amber: 'gold', indigo: 'ocean' }
        var a = localStorage.getItem('splitit-accent')
        if (retired.hasOwnProperty(a)) a = retired[a]
        if (!accents.hasOwnProperty(a)) a = 'violet'
        var root = document.documentElement
        root.setAttribute('data-accent', a)
        if (localStorage.getItem('splitit-duo') === 'off') root.setAttribute('data-duo', 'off')
        // Text on accent: this accent's stored choice ({"violet":"dark"}), else the preset's default
        // (dark ink only for these). Bad JSON or an old plain value falls back to the default.
        var darkInk = ['neon']
        var ink
        try {
          var inks = JSON.parse(localStorage.getItem('splitit-ink') || '{}')
          ink = inks && inks.hasOwnProperty(a) ? inks[a] : null
        } catch (e) {}
        if (ink !== 'light' && ink !== 'dark') ink = darkInk.indexOf(a) >= 0 ? 'dark' : 'light'
        root.setAttribute('data-ink', ink)
        document.querySelector('meta[name="theme-color"]').setAttribute('content', root.classList.contains('dark') ? '#0b0a14' : accents[a])
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div class="boot" role="img" aria-label="Split Now"><div class="boot-stack"><img class="boot-logo" src="/favicon.svg" alt="" /><p class="boot-tag" aria-hidden="true"><span class="boot-l1">Spending is wise, splitting is free.</span><span class="boot-l2">Split Now!</span></p></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
