<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Split Now</title>
    <meta name="description" content="Spending is wise, Splitting is Free. Split Now! Split bills with friends, scan receipts and settle up over UPI in a tap." />
    <meta property="og:title" content="Split Now" />
    <meta property="og:description" content="Spending is wise, Splitting is Free. Split Now!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://split-now.web.app" />
    <meta property="og:image" content="https://split-now.web.app/pwa-512.png" />
    <meta name="theme-color" content="#6d28d9" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Split Now" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      /*
       * Splash from the HTML alone, while #root is still empty: the same brand gradient and mark
       * as <Splash/> in src/App.tsx, which takes over for the sign-in check without a visible
       * change. The accent variables come from the stylesheet (index.css); the hex values are the
       * violet defaults for the moment before it lands. Inter is self-hosted (src/fonts.css), so
       * nothing on this path waits on another origin.
       */
      #root:empty { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: linear-gradient(to bottom right, var(--color-brand-700, #6d28d9), var(--color-duo-700, #a21caf)); background: linear-gradient(to bottom right in oklab, var(--color-brand-700, #6d28d9), var(--color-duo-700, #a21caf)); }
      #root:empty::before { content: ''; width: 5rem; height: 5rem; background: url(/favicon.svg) center / contain no-repeat; filter: drop-shadow(0 20px 30px rgb(0 0 0 / 0.35)); animation: splash-pop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
      @keyframes splash-pop { from { transform: scale(0.9); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #root:empty::before { animation: none; } }
    </style>
    <script>
      // Apply theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('splitit-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
      // Accent colour + dual tone (src/lib/accent.ts). Keep this map in sync with ACCENTS there.
      try {
        var accents = { violet: '#6d28d9', ocean: '#1447e6', indigo: '#432dd7', saffron: '#973c00', graphite: '#314158' }
        var a = localStorage.getItem('splitit-accent')
        if (!accents.hasOwnProperty(a)) a = 'violet'
        var root = document.documentElement
        root.setAttribute('data-accent', a)
        if (localStorage.getItem('splitit-duo') === 'off') root.setAttribute('data-duo', 'off')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', root.classList.contains('dark') ? '#0b0a14' : accents[a])
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
